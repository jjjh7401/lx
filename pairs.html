<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>사운드와 조명 매칭</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="lx.css">
<style>
/* 레이아웃: 왼쪽에 소리 카드(누를 때마다 꺼짐 → 들림 → 따라감), 오른쪽에 짝이 된 조명과 무대 혼잡도, 아래에 구간별 정리 */
.head{display:grid;gap:6px;padding-block:22px 6px}
.head p{margin:0;color:var(--muted);max-width:66ch}
.secbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0}
.secbar button{padding:6px 11px;font-size:13.5px;border-radius:999px}
.secbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.secbar .lab{font-size:12.5px;color:var(--muted);margin-right:4px}
.main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:1fr}}
.grp{display:grid;gap:8px;margin-bottom:14px}
.grp h3{font-size:12.5px;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.grp h3::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--gc)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.snd{display:grid;gap:2px;text-align:left;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);position:relative}
.snd b{color:var(--ink);font-size:15px}
.snd span{font-size:12.5px;color:var(--muted)}
.snd .st{position:absolute;top:8px;right:10px;font-size:12px;font-weight:700}
.snd[data-s="1"]{border-color:var(--gc);border-style:dashed}
.snd[data-s="1"] .st{color:var(--muted)}
.snd[data-s="2"]{border-color:var(--gc);background:color-mix(in srgb,var(--gc) 16%,var(--panel))}
.snd[data-s="2"] .st{color:var(--gc)}
.how{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 12px}
.how i{font-style:normal;border:1.5px solid var(--muted);border-radius:4px;padding:0 5px;margin-right:4px}
.how i.d{border-style:dashed}
.meter{display:grid;gap:8px;margin-bottom:12px}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.bars span{height:10px;border-radius:3px;background:var(--panel2)}
.bars span.on{background:var(--mc)}
.mtext{font-size:14px;color:var(--ink)}
.mtext b{color:var(--mc)}
.lit{display:grid;gap:8px}
.lt{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 12px;border-radius:10px;background:var(--panel2);border-left:4px solid var(--gc)}
.lt .from{font-size:12px;color:var(--muted);grid-column:1/-1}
.lt b{color:var(--ink)}
.lt .d{font-size:13px;color:var(--body);grid-column:1/-1}
.lt .w{font-size:12.5px;color:var(--warn);grid-column:1/-1}
.lt .mv{font-size:12px;font-weight:700;color:var(--muted);align-self:center;justify-self:end}
.empty{font-size:13.5px;color:var(--muted);padding:14px;border:1px dashed var(--line);border-radius:10px}
.heard{font-size:13px;color:var(--muted)}
.sum td:nth-child(3),.sum td:nth-child(4){font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>사운드와 조명 매칭</h1>
    <p>1장 그림 1-2를 눌러 보는 판입니다. 지금 들리는 소리를 고르고, 그중 조명이 따라갈 소리를 정합니다. 들리는 소리를 모두 따라가면 무대가 소리보다 시끄러워집니다. 짝은 고를 수 있는 목록입니다.</p>
  </div>

  <div class="secbar" id="secbar"><span class="lab">구간</span></div>

  <div class="main">
    <section class="panel" aria-label="소리">
      <p class="how"><span><i class="d">점선</i>들림</span><span><i>채움</i>따라감</span><span>카드를 누를 때마다 꺼짐 → 들림 → 따라감 순서로 바뀝니다</span></p>
      <div id="sounds"></div>
      <div class="row"><span class="note">빠른 시작</span>
        <button type="button" data-pre="intro">인트로</button><button type="button" data-pre="verse">벌스</button><button type="button" data-pre="pre">프리코러스</button><button type="button" data-pre="chorus">후렴</button><button type="button" data-pre="drop">드롭</button><button type="button" data-pre="clear" class="ghost">모두 끄기</button></div>
    </section>
    <section class="panel" aria-label="짝이 된 조명">
      <div class="meter" id="meter"></div>
      <div class="lit" id="lit"></div>
      <p class="heard" id="heard"></p>
    </section>
  </div>

  <section class="panel" style="margin-top:16px" aria-label="구간별 정리">
    <div class="row" style="justify-content:space-between"><h2>구간별로 따라갈 소리</h2><button type="button" id="copy">정리 복사</button></div>
    <p class="note">구간은 듣기 노트에 적은 "구간 시작"에서 옵니다. 같은 곡 데이터라서 곡 구성표에도 이어집니다.</p>
    <p class="note" id="copyMsg"></p>
    <div class="tbl"><table class="sum" id="sum"></table></div>
  </section>
</div>

<script src="lx.js"></script>
<script>
(function () {
  'use strict';
  var L = window.LX, S = L.top('pairs.html'), $ = function (id) { return document.getElementById(id); };
  var GROUPS = [['rhythm', '리듬', '--impact'], ['weight', '무게와 화성', '--sec'], ['line', '선율과 사람', '--ok'], ['change', '변화', '--warn']];
  var SND = [
    { k: 'kick', g: 'rhythm', n: '킥', s: '쿵 — 박의 바닥', l: '밝기 펄스', d: '디머가 박에 맞춰 숨 쉽니다.', mv: 1, w: '박마다 펄스는 후렴 같은 큰 구간에 아껴 둡니다(2장 표 2-5).' },
    { k: 'snare', g: 'rhythm', n: '스네어 · 박수', s: '탁 — 2·4박의 악센트', l: '짧은 플래시 · 셔터', d: '한 번 끊어 칩니다.', mv: 1, w: '8분음표로 깜박이면 90 BPM부터 방송 기준(초당 3회)을 넘습니다(2장).' },
    { k: 'hat', g: 'rhythm', n: '하이햇', s: '츠츠 — 잘게 쪼갠 박', l: '빠른 질감', d: '픽셀 칩, 작은 깜박임.', mv: 1, w: '16분음표 깜박임은 Hz를 꼭 확인합니다(2장 표 2-4).' },
    { k: 'bass', g: 'weight', n: '베이스', s: '곡의 무게', l: '워시 밝기의 바닥', d: '무대가 얼마나 꽉 찼는지를 정합니다.', mv: 0, w: '' },
    { k: 'pad', g: 'weight', n: '패드 · 코드', s: '곡의 공기, 화성', l: '색과 느린 변화', d: '구간 팔레트, 긴 페이드.', mv: 0, w: '' },
    { k: 'lead', g: 'line', n: '리드 멜로디', s: '기타 · 신스 리드', l: '빔 · 무빙 포지션', d: '선율의 선을 그립니다.', mv: 1, w: '' },
    { k: 'vox', g: 'line', n: '보컬', s: '가사와 얼굴', l: '프런트 키 · 팔로우', d: '언제나 얼굴이 먼저입니다.', mv: 0, w: '카메라로 나가는 무대라면 배경보다 얼굴 밝기를 먼저 맞춥니다(1장).' },
    { k: 'riser', g: 'change', n: '라이저 · 필', s: '올라가는 소리', l: '줌 · 속도 · 밝기 상승', d: '기대를 쌓는 트랜지션입니다.', mv: 1, w: '범위는 오히려 좁히고, 넓게 퍼지는 것은 터질 자리에 아낍니다(4장).' },
    { k: 'crash', g: 'change', n: '크래시 · 드롭', s: '터지는 순간', l: '블라인더 · 전체 히트', d: '곡에서 몇 번만 쓰는 임팩트입니다.', mv: 1, w: '아껴야 터집니다. 곡 전체에서 세 번 안쪽으로(4장, 10장).' }
  ];
  var PRE = {
    intro: { pad: 2, kick: 1, vox: 1 }, verse: { kick: 1, bass: 2, vox: 2, hat: 1 }, pre: { riser: 2, snare: 1, vox: 2, bass: 1 },
    chorus: { kick: 2, snare: 1, hat: 1, bass: 2, lead: 1, vox: 2 }, drop: { kick: 2, bass: 2, crash: 2, hat: 1 }, clear: {}
  };
  var secs = L.sections(S), cur = secs.length ? secs[0].m.id : '_free';
  S.follow = S.follow || {};
  var free = {};
  function state() { return cur === '_free' ? free : (S.follow[cur] = S.follow[cur] || {}); }
  function css(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

  function renderSecbar() {
    var b = $('secbar'); b.innerHTML = '<span class="lab">구간</span>';
    secs.forEach(function (sc) { b.insertAdjacentHTML('beforeend', '<button type="button" data-id="' + sc.m.id + '" aria-pressed="' + (cur === sc.m.id) + '">' + L.esc(sc.m.name) + ' <span class="num muted">' + sc.start + '</span></button>'); });
    b.insertAdjacentHTML('beforeend', '<button type="button" data-id="_free" aria-pressed="' + (cur === '_free') + '">구간 없이 연습</button>');
    if (!secs.length) b.insertAdjacentHTML('beforeend', '<span class="note">듣기 노트에서 구간을 적으면 구간마다 따로 정할 수 있습니다.</span>');
  }
  $('secbar').addEventListener('click', function (e) { var bt = e.target.closest('button'); if (!bt) return; cur = bt.dataset.id; renderAll(); });

  function renderSounds() {
    var st = state();
    $('sounds').innerHTML = GROUPS.map(function (g) {
      return '<div class="grp" style="--gc:var(' + g[2] + ')"><h3>' + g[1] + '</h3><div class="cards">' + SND.filter(function (x) { return x.g === g[0]; }).map(function (x) {
        var s = st[x.k] || 0; return '<button type="button" class="snd" data-k="' + x.k + '" data-s="' + s + '" aria-label="' + x.n + ' ' + ['꺼짐', '들림', '따라감'][s] + '"><b>' + x.n + '</b><span>' + x.s + '</span><span class="st">' + ['', '들림', '따라감'][s] + '</span></button>';
      }).join('') + '</div></div>';
    }).join('');
  }
  $('sounds').addEventListener('click', function (e) { var b = e.target.closest('.snd'); if (!b) return; var st = state(); st[b.dataset.k] = ((st[b.dataset.k] || 0) + 1) % 3; persist(); renderAll(); });
  document.querySelectorAll('[data-pre]').forEach(function (b) { b.addEventListener('click', function () { var p = PRE[b.dataset.pre], st = state(); SND.forEach(function (x) { st[x.k] = p[x.k] || 0; }); persist(); renderAll(); }); });

  function busyOf(st) { return SND.filter(function (x) { return st[x.k] === 2 && x.mv; }).length; }
  function level(n) { return n <= 2 ? ['차분함', '--ok', '움직이는 조명이 ' + n + '가지입니다. 소리와 무대가 같은 크기로 들립니다.'] : n === 3 ? ['바쁨', '--warn', '움직이는 조명이 세 가지입니다. 후렴이나 드롭처럼 큰 구간이 아니면 하나를 덜어 봅니다.'] : ['시끄러움', '--bad', '움직이는 조명이 ' + n + '가지입니다. 무대가 소리보다 시끄러워집니다. 한두 가지만 남기고 나머지는 "들림"으로 돌려 봅니다.']; }
  function renderLit() {
    var st = state(), on = SND.filter(function (x) { return st[x.k] === 2; }), heard = SND.filter(function (x) { return st[x.k] === 1; });
    var n = busyOf(st), lv = level(n);
    $('meter').style.setProperty('--mc', css(lv[1]));
    $('meter').innerHTML = '<div class="row" style="justify-content:space-between"><h2>무대 혼잡도</h2><span class="tag" style="color:var(' + lv[1] + ')">' + lv[0] + '</span></div>' +
      '<div class="bars">' + [1, 2, 3, 4, 5, 6].map(function (i) { return '<span class="' + (i <= n ? 'on' : '') + '"></span>'; }).join('') + '</div><p class="mtext" style="margin:0">' + lv[2] + '</p>';
    $('lit').innerHTML = on.length ? on.map(function (x) {
      var g = GROUPS.find(function (gg) { return gg[0] === x.g; });
      return '<div class="lt" style="--gc:var(' + g[2] + ')"><span class="from">' + L.eul(x.n) + ' 따라</span><b>' + x.l + '</b><span class="mv">' + (x.mv ? '움직임' : '베이스') + '</span><span class="d">' + x.d + '</span>' + (x.w ? '<span class="w">' + x.w + '</span>' : '') + '</div>';
    }).join('') : '<div class="empty">따라갈 소리를 고르면 짝이 되는 조명이 여기에 나타납니다. 카드를 두 번 누르면 "따라감"이 됩니다.</div>';
    $('heard').textContent = heard.length ? '들리지만 따라가지 않는 소리: ' + heard.map(function (x) { return x.n; }).join(', ') + '. 이 소리들은 조명 대신 음악에 맡겨 둡니다.' : '';
  }
  function sumRows() {
    return secs.map(function (sc) {
      var st = S.follow[sc.m.id] || {}, f = SND.filter(function (x) { return st[x.k] === 2; }), n = busyOf(st), lv = level(n);
      return [sc.m.name, sc.start + (sc.end > sc.start ? '~' + sc.end : ''), f.map(function (x) { return x.n + '→' + x.l; }).join(', '), lv[0], lv[1]];
    });
  }
  function renderSum() {
    var rows = sumRows();
    $('sum').innerHTML = '<tr><th>구간</th><th>마디</th><th>따라갈 소리 → 조명</th><th>혼잡도</th></tr>' + (rows.length ? rows.map(function (r) {
      return '<tr><td>' + L.esc(r[0]) + '</td><td class="num">' + r[1] + '</td><td>' + (r[2] || '<span class="muted">아직 정하지 않음</span>') + '</td><td>' + (r[2] ? '<span class="dot" style="background:var(' + r[4] + ')"></span>' + r[3] : '') + '</td></tr>';
    }).join('') : '<tr><td colspan="4" class="note">듣기 노트에서 구간을 먼저 적어 봅니다.</td></tr>');
  }
  L.copyBar($('copy'), $('copyMsg'), function () {
    return { title: '구간별로 따라갈 소리 · ' + (S.title || ''), head: ['구간', '마디', '따라갈 소리 → 조명', '혼잡도'], rows: sumRows().filter(function (r) { return r[2]; }).map(function (r) { return [r[0], r[1], r[2], r[3]]; }) };
  });

  function persist() { if (cur !== '_free') L.put(S); }
  function renderAll() { renderSecbar(); renderSounds(); renderLit(); renderSum(); }
  renderAll();
})();
</script>
</body>
</html>
